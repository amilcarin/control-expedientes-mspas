<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verificación de Certificado</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
    color:#222;
}

/* HEADER */

.header{
    background:#69aee8;
    padding:18px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-logo{
    width:100%;
    max-width:420px;
}

/* CONTENIDO */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.title{
    font-size:48px;
    font-weight:bold;
    margin-bottom:25px;
}

.info-box{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:25px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.info{
    font-size:28px;
    margin-bottom:15px;
}

.info strong{
    color:#0f4c81;
}

/* VISOR */

.viewer{
    background:#ececec;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

/* TOOLBAR */

.toolbar{
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 20px;
    border-bottom:1px solid #ddd;
}

.status{
    background:#dff0d8;
    color:#2e7d32;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    font-size:16px;
}

.zoom-controls{
    display:flex;
    gap:10px;
}

.zoom-btn{
    width:50px;
    height:50px;
    border:none;
    background:#6b5ca5;
    color:white;
    font-size:28px;
    border-radius:8px;
    cursor:pointer;
    transition:.2s;
}

.zoom-btn:hover{
    transform:scale(1.05);
}

/* PDF */

.pdf-container{
    width:100%;
    height:85vh;
    overflow:auto;
    background:#bdbdbd;
    display:flex;
    justify-content:center;
    padding:20px;
}

.pdf-viewer{
    width:100%;
    max-width:900px;
    height:100%;
    border:none;
    background:white;
    transform-origin:top center;
    transition:transform .2s ease;
}

/* ERROR */

.error-message{
    background:white;
    padding:40px;
    border-radius:10px;
    text-align:center;
    font-size:24px;
    color:#d32f2f;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

/* RESPONSIVE */

@media(max-width:768px){

    .title{
        font-size:30px;
    }

    .info{
        font-size:20px;
    }

    .toolbar{
        flex-direction:column;
        gap:15px;
    }

    .pdf-container{
        height:75vh;
    }

}

</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="header-logo">
</div>

<div class="container">

    <div class="title">
        Verificación de Certificado
    </div>

    <div class="info-box">

        <div class="info">
            <strong>Número de Expediente:</strong>
            <span id="txtExpediente">Cargando...</span>
        </div>

        <div class="info">
            <strong>Estado:</strong>
            <span id="txtEstado">Validando...</span>
        </div>

    </div>

    <div class="viewer" id="viewer">

        <div class="toolbar">

            <div class="status" id="statusBadge">
                Documento válido
            </div>

            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <button class="zoom-btn" onclick="zoomIn()">+</button>
            </div>

        </div>

        <div class="pdf-container">

            <iframe
                id="pdfViewer"
                class="pdf-viewer">
            </iframe>

        </div>

    </div>

    <div
        class="error-message"
        id="errorContainer"
        style="display:none;">

        El expediente no existe o no está disponible.

    </div>

</div>

<script>

let zoom = 1;

/* CARGAR EXPEDIENTE */

function cargarExpediente(){

    const params = new URLSearchParams(window.location.search);

    const idExpediente = params.get('id');

    const txtExpediente = document.getElementById('txtExpediente');

    const txtEstado = document.getElementById('txtEstado');

    const pdfViewer = document.getElementById('pdfViewer');

    const viewer = document.getElementById('viewer');

    const errorContainer = document.getElementById('errorContainer');

    const statusBadge = document.getElementById('statusBadge');

    if(!idExpediente){

        mostrarError('No se especificó expediente');
        return;

    }

    /* VALIDACIÓN CORREGIDA */
    const regex = /^DDRISS-TS-\d+$/;

    if(!regex.test(idExpediente)){

        mostrarError('Formato inválido');
        return;

    }

    txtExpediente.innerText = idExpediente;

    txtEstado.innerText = 'Válido / Firmado';

    /* RUTA PDF */

    const rutaPDF = `expedientes/${idExpediente}.pdf`;

    /* VERIFICAR SI EXISTE */

    fetch(rutaPDF)
    .then(response => {

        if(response.ok){

            pdfViewer.src = rutaPDF;

            viewer.style.display = 'block';

            errorContainer.style.display = 'none';

        }else{

            mostrarError('Expediente no encontrado');

        }

    })
    .catch(() => {

        mostrarError('Error al cargar documento');

    });

}

/* ERROR */

function mostrarError(mensaje){

    document.getElementById('viewer').style.display = 'none';

    document.getElementById('errorContainer').style.display = 'block';

    document.getElementById('errorContainer').innerText = mensaje;

    document.getElementById('txtEstado').innerText = 'Error';

    document.getElementById('statusBadge').style.background = '#ffcdd2';

    document.getElementById('statusBadge').style.color = '#b71c1c';

    document.getElementById('statusBadge').innerText = 'Documento inválido';

}

/* ZOOM */

function zoomIn(){

    zoom += 0.1;

    updateZoom();

}

function zoomOut(){

    if(zoom > 0.5){

        zoom -= 0.1;

        updateZoom();

    }

}

function updateZoom(){

    document.getElementById('pdfViewer').style.transform = `scale(${zoom})`;

}

/* INICIAR */

window.onload = cargarExpediente;

</script>

</body>
</html>
