<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Certificado</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#222;
}

/* HEADER - Idéntico al oficial */
.header{
    background:#5cb1ff;
    padding:15px 20px;
    display:flex;
    justify-content:flex-start;
    align-items:center;
}

.header-logo{
    width:100%;
    max-width:340px;
    height:auto;
}

/* CONTENIDO PRINCIPAL */
.container{
    max-width:100%;
    margin:auto;
    padding:25px 20px;
}

.title{
    font-size:32px;
    font-weight:700;
    color:#212529;
    margin-bottom:15px;
    letter-spacing: -0.5px;
}

.info-box{
    background:transparent;
    margin-bottom:20px;
}

.info{
    font-size:24px;
    margin-bottom:12px;
    color:#212529;
}

.info strong{
    font-weight: 700;
}

.info span{
    font-weight: 400;
    color:#212529;
}

/* VISOR DE EXPEDIENTE INTEGRADO */
.viewer{
    background:#ffffff;
    border-top: 1px solid #e0e0e0;
    margin-top: 10px;
}

/* TOOLBAR DEL VISOR (Menú de tres líneas, - , +) */
.toolbar{
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 5px;
    border-bottom:1px solid #e0e0e0;
}

.menu-icon {
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    padding: 5px;
}

.menu-icon span {
    display: block;
    width: 18px;
    height: 2px;
    background-color: #555555;
}

.zoom-controls{
    display:flex;
    align-items: center;
    gap:20px;
    margin-right: auto;
    margin-left: auto;
}

.zoom-btn{
    border: none;
    background: transparent;
    color: #555555;
    font-size: 24px;
    cursor: pointer;
    padding: 0 10px;
    font-weight: 300;
}

/* CONTENEDOR DEL PDF DEL EXPEDIENTE */
.pdf-container{
    width:100%;
    background:#f1f3f4; /* Gris de fondo de visores oficiales */
    display:flex;
    justify-content:center;
    padding:15px 10px;
    min-height: 70vh;
    overflow-x: auto;
}

.pdf-viewer{
    width:100%;
    max-width:850px;
    height: 75vh;
    border: 1px solid #dcdcdc;
    background:white;
    box-shadow: 0px 1px 3px rgba(0,0,0,0.1);
    transform-origin: top center;
    transition: transform .2s ease;
}

/* MENSAJE DE ERROR */
.error-message{
    background:#f8d7da;
    padding:20px;
    border-radius:5px;
    text-align:center;
    font-size:18px;
    color:#721c24;
    border: 1px solid #f5c6cb;
    margin-top: 20px;
}

/* AJUSTES RESPONSIVOS (Móviles exactos como tu captura) */
@media(max-width:768px){
    .header {
        padding: 12px 15px;
    }
    .header-logo {
        max-width: 260px;
    }
    .title{
        font-size:28px;
    }
    .info{
        font-size:20px;
    }
    .pdf-container {
        padding: 8px 5px;
    }
    .pdf-viewer {
        height: 65vh;
    }
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.png" class="header-logo" alt="Ministerio de Salud Pública y Asistencia Social">
</div>

<div class="container">

    <div class="title">
        Verificación de Certificado
    </div>

    <div class="info-box">
        <div class="info">
            <strong>Número de Expediente:</strong>
            <span id="txtExpediente">Cargando...</span>
        </div>
        <div class="info">
            <strong>Estado:</strong>
            <span id="txtEstado">Validando...</span>
        </div>
    </div>

    <div class="viewer" id="viewer">
        <div class="toolbar">
            <div class="menu-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
            
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <button class="zoom-btn" onclick="zoomIn()">+</button>
            </div>
        </div>

        <div class="pdf-container">
            <iframe
                id="pdfViewer"
                class="pdf-viewer">
            </iframe>
        </div>
    </div>

    <div class="error-message" id="errorContainer" style="display:none;">
        El expediente no existe o no está disponible.
    </div>

</div>

<script>
let zoom = 1;

function cargarExpediente(){
    const params = new URLSearchParams(window.location.search);
    const idExpediente = params.get('id');

    const txtExpediente = document.getElementById('txtExpediente');
    const txtEstado = document.getElementById('txtEstado');
    const pdfViewer = document.getElementById('pdfViewer');
    const viewer = document.getElementById('viewer');
    const errorContainer = document.getElementById('errorContainer');

    if(!idExpediente){
        mostrarError('No se especificó ningún número de expediente.');
        return;
    }

    /* Expresión regular corregida para admitir ceros a la izquierda */
    const regex = /^DDRISS-TS-\d+$/;

    if(!regex.test(idExpediente)){
        mostrarError('El formato del número de expediente es inválido.');
        return;
    }

    txtExpediente.innerText = idExpediente;
    txtEstado.innerText = 'En emisión';

    /* Ruta interna del PDF almacenado en tu carpeta de GitHub */
    const rutaPDF = `expedientes/${idExpediente}.pdf`;

    /* Petición interna para cargar el PDF dentro del iframe de forma segura */
    fetch(rutaPDF)
    .then(response => {
        if(response.ok){
            pdfViewer.src = rutaPDF;
            viewer.style.display = 'block';
            errorContainer.style.display = 'none';
        }else{
            mostrarError('El expediente solicitado no fue encontrado en el servidor.');
        }
    })
    .catch(() => {
        mostrarError('Ocurrió un error al intentar consultar el documento.');
    });
}

function mostrarError(mensaje){
    document.getElementById('viewer').style.style.opacity = '0.3'; // Opcional: difumina si hay error
    document.getElementById('viewer').style.display = 'none';
    document.getElementById('errorContainer').style.display = 'block';
    document.getElementById('errorContainer').innerText = mensaje;
    document.getElementById('txtEstado').innerText = 'Error';
}

/* Controles de escala exactos */
function zoomIn(){
    zoom += 0.1;
    updateZoom();
}

function zoomOut(){
    if(zoom > 0.6){
        zoom -= 0.1;
        updateZoom();
    }
}

function updateZoom(){
    document.getElementById('pdfViewer').style.transform = `scale(${zoom})`;
}

window.onload = cargarExpediente;
</script>

</body>
</html>
